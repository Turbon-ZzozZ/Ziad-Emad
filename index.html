<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ziad Emad | Personal Digital Card</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080a09;
      color: #fff;
    }

    button,
    input {
      font-family: inherit;
    }

    /* LOGIN */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #0d110f;
      border: 1px solid #1d6b45;
      border-radius: 22px;
      padding: 30px 24px;
      box-shadow: 0 0 35px rgba(57, 255, 136, 0.08);
      text-align: center;
    }

    .auth-photo {
      width: 105px;
      height: 105px;
      margin: 0 auto 18px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #39ff88;
      background: #080a09;
      box-shadow: 0 0 25px rgba(57, 255, 136, 0.25);
    }

    .auth-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .auth-card h1 {
      margin: 0;
      color: #39ff88;
      font-size: 28px;
    }

    .auth-subtitle {
      color: #aaa;
      margin: 8px 0 25px;
      font-size: 14px;
    }

    .auth-card input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid #1d6b45;
      background: #080a09;
      color: white;
      outline: none;
      direction: ltr;
    }

    .auth-card input:focus {
      border-color: #39ff88;
      box-shadow: 0 0 10px rgba(57, 255, 136, 0.12);
    }

    .main-auth-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #39ff88;
      color: #080a09;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .or {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #666;
      margin: 20px 0;
    }

    .or::before,
    .or::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #1d6b45;
    }

    .social-login {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      margin-bottom: 10px;
      transition: 0.25s;
    }

    .social-login:hover {
      transform: translateY(-2px);
      opacity: 0.93;
    }

    .social-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .social-login svg {
      width: 21px;
      height: 21px;
    }

    .google-btn {
      background: white;
      color: #222;
      border: none;
    }

    .facebook-btn {
      background: #1877f2;
      color: white;
      border: none;
    }

    .switch-auth {
      margin-top: 18px;
      color: #aaa;
      font-size: 14px;
    }

    .switch-auth button {
      background: none;
      border: 0;
      color: #39ff88;
      cursor: pointer;
      font-weight: bold;
    }

    #authMessage {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.7;
      color: #ff8585;
      word-break: break-word;
    }

    /* MAIN SITE */

    #site {
      display: none;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    .top-user {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      background: #0d110f;
      border: 1px solid #1d6b45;
      padding: 10px 12px;
      border-radius: 14px;
    }

    .user-email {
      color: #aaa;
      font-size: 12px;
      direction: ltr;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      border: 1px solid #1d6b45;
      background: transparent;
      color: #39ff88;
      border-radius: 9px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .card {
      background: #0d110f;
      border: 1px solid #1d6b45;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 0 35px rgba(57, 255, 136, 0.08);
    }

    .profile {
      text-align: center;
    }

    .profile img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #39ff88;
      box-shadow: 0 0 25px rgba(57, 255, 136, 0.18);
    }

    .profile h1 {
      margin: 15px 0 5px;
      color: white;
      font-size: 27px;
    }

    .profile p {
      color: #39ff88;
      margin: 0 0 22px;
    }

    .section-title {
      color: #39ff88;
      font-size: 14px;
      margin: 20px 0 10px;
      text-align: right;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .buttons a {
      text-decoration: none;
      color: white;
      background: #111713;
      border: 1px solid #1d6b45;
      border-radius: 12px;
      padding: 13px;
      text-align: center;
      transition: 0.25s;
    }

    .buttons a:hover {
      background: #39ff88;
      color: #080a09;
      transform: translateY(-2px);
    }

    .legal-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .legal-links a {
      color: #39ff88;
      text-decoration: none;
      border: 1px solid #1d6b45;
      background: #111713;
      padding: 10px 13px;
      border-radius: 10px;
      font-size: 13px;
      transition: 0.25s;
    }

    .legal-links a:hover {
      background: #39ff88;
      color: #080a09;
      transform: translateY(-2px);
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="authScreen">

          />
          <path

          />
          <path

          />

        تسجيل الدخول باستخدام Google

      </button>

      <!-- FACEBOOK -->

      <button
        class="social-login facebook-btn"
        id="facebookBtn"
        onclick="loginWithFacebook()"
      >

        <svg viewBox="0 0 24 24">
          <path
            fill="white"
            d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.87.24-1.46 1.5-1.46h1.7V4a22 22 0 0 0-2.48-.13c-2.46 0-4.15 1.5-4.15 4.25V10H7.5v3h2.57v8h3.43z"
          />
        </svg>

        تسجيل الدخول باستخدام Facebook

      </button>

      <div class="switch-auth">

        <span id="switchText">

        </span>

        <button

          onclick="toggleAuthMode()"

        </button>

      </div>

      <div id="authMessage"></div>

    </div>

  </div>


  <!-- MAIN WEBSITE -->

  <script>

    /* SUPABASE */

    const SUPABASE_URL =
      "https://mmedeahojjxladtmdplc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_h3_fleADmTTN5MrEzvIgjA_o5dJ4_Y7";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let isLoginMode = true;


    /* ELEMENTS */

    const authScreen =
      document.getElementById("authScreen");

    const site =
      document.getElementById("site");

    const authTitle =
      document.getElementById("authTitle");

    const mainAuthBtn =
      document.getElementById("mainAuthBtn");

    const googleBtn =
      document.getElementById("googleBtn");

    const facebookBtn =
      document.getElementById("facebookBtn");

    const switchText =
      document.getElementById("switchText");

    const switchAuthBtn =
      document.getElementById("switchAuthBtn");

    const authMessage =
      document.getElementById("authMessage");

    const userEmail =
      document.getElementById("userEmail");


    /* SHOW SITE */

    function showSite(user) {

      authScreen.style.display = "none";

      site.style.display = "block";

      if (user) {
        userEmail.textContent =
          user.email || "User";
      }
    }


    function showLogin() {

      site.style.display = "none";

      authScreen.style.display = "flex";
    }


    /* LOGIN / SIGNUP MODE */

    function toggleAuthMode() {

      isLoginMode = !isLoginMode;

      authMessage.textContent = "";

      if (isLoginMode) {

        authTitle.textContent =
          "تسجيل الدخول";

        mainAuthBtn.textContent =
          "تسجيل الدخول";

        switchText.textContent =
          "ليس لديك حساب؟";

        switchAuthBtn.textContent =
          "إنشاء حساب";

      } else {

        authTitle.textContent =
          "إنشاء حساب";

        mainAuthBtn.textContent =
          "إنشاء الحساب";

        switchText.textContent =
          "لديك حساب بالفعل؟";

        switchAuthBtn.textContent =
          "تسجيل الدخول";
      }
    }


    /* EMAIL LOGIN / SIGNUP */

    async function handleEmailAuth() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      authMessage.style.color = "#ff8585";
      authMessage.textContent = "";

      if (!email || !password) {

        authMessage.textContent =
          "من فضلك أدخل البريد الإلكتروني وكلمة المرور.";

        return;
      }

      mainAuthBtn.disabled = true;

      try {

        if (isLoginMode) {

          const { data, error } =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });

          if (error) {

            authMessage.textContent =
              error.message;

          } else if (data.user) {

            showSite(data.user);
          }

        } else {

          const { data, error } =
            await supabaseClient.auth.signUp({

              email: email,
              password: password,

              options: {
                emailRedirectTo:
                  window.location.origin +
                  window.location.pathname
              }

            });

          if (error) {

            authMessage.textContent =
              error.message;

          } else {

            authMessage.style.color =
              "#39ff88";

            authMessage.textContent =
              "تم إنشاء الحساب. راجع بريدك الإلكتروني لتأكيد الحساب.";
          }
        }

      } catch (error) {

        authMessage.textContent =
          "حدث خطأ: " + error.message;

      }

      mainAuthBtn.disabled = false;
    }


    /* GOOGLE LOGIN */

    async function loginWithGoogle() {

      authMessage.style.color = "#39ff88";
      authMessage.textContent =
        "جاري فتح تسجيل الدخول باستخدام Google...";

      googleBtn.disabled = true;

      try {

        const { data, error } =
          await supabaseClient.auth.signInWithOAuth({

            provider: "google",

            options: {
              redirectTo:
                window.location.origin +
                window.location.pathname
            }

          });

        if (error) {

          console.error("Google OAuth Error:", error);

          authMessage.style.color = "#ff8585";
          authMessage.textContent =
            "حدث خطأ أثناء فتح Google: " +
            error.message;

          googleBtn.disabled = false;
        }

      } catch (error) {

        console.error("Google Error:", error);

        authMessage.style.color = "#ff8585";
        authMessage.textContent =
          "حدث خطأ غير متوقع: " +
          error.message;

        googleBtn.disabled = false;
      }
    }


    /* FACEBOOK LOGIN */

    async function loginWithFacebook() {

      authMessage.style.color = "#39ff88";
      authMessage.textContent =
        "جاري فتح تسجيل الدخول باستخدام Facebook...";

      facebookBtn.disabled = true;

      try {

        const redirectTo =
          window.location.origin +
          window.location.pathname;

        const { data, error } =
          await supabaseClient.auth.signInWithOAuth({

            provider: "facebook",

            options: {
              redirectTo: redirectTo,
              skipBrowserRedirect: true
            }

          });

        if (error) {

          console.error(
            "Facebook OAuth Error:",
            error
          );

          authMessage.style.color = "#ff8585";

          authMessage.textContent =
            "حدث خطأ أثناء فتح Facebook: " +
            error.message;

          facebookBtn.disabled = false;

          return;
        }

        if (data && data.url) {

          window.location.href = data.url;

        } else {

          authMessage.style.color = "#ff8585";

          authMessage.textContent =
            "لم يتم إنشاء رابط تسجيل الدخول إلى Facebook.";

          facebookBtn.disabled = false;
        }

      } catch (error) {

        console.error(
          "Facebook Error:",
          error
        );

        authMessage.style.color = "#ff8585";

        authMessage.textContent =
          "حدث خطأ غير متوقع أثناء فتح Facebook: " +
          error.message;

        facebookBtn.disabled = false;
      }
    }


    /* LOGOUT */

    async function logout() {

      await supabaseClient.auth.signOut();

      showLogin();
    }


    /* CHECK SESSION */

    async function checkSession() {

      try {

        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) {

          console.error(
            "Session Error:",
            error
          );

          showLogin();

          return;
        }

        if (data.session) {

          showSite(data.session.user);

        } else {

          showLogin();
        }

      } catch (error) {

        console.error(
          "Check Session Error:",
          error
        );

        showLogin();
      }
    }


    /* AUTH STATE */

    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        if (session) {

          showSite(session.user);

        } else {

          showLogin();
        }

      }
    );


    /* START */

    checkSession();

  </script>
