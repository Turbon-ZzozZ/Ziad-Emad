<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ziad Emad Atta | Digital Card</title>
<meta name="theme-color" content="#080a09">

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:#080a09;
  color:#f4f7f5;
  font-family:Arial,sans-serif;
}

/* ================= AUTH SCREEN ================= */

.auth-screen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 0%,#123d27 0%,#080a09 42%);
  overflow:auto;
}

.auth-card{
  width:100%;
  max-width:430px;
  padding:30px 22px;
  border:1px solid #1d6b45;
  border-radius:30px;
  background:linear-gradient(145deg,#111614,#0b0d0c);
  box-shadow:
    0 25px 80px #000b,
    0 0 35px #18d26e12;
  animation:cardAppear .7s ease;
}

@keyframes cardAppear{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.auth-logo{
  width:90px;
  height:90px;
  margin:0 auto 18px;
  border-radius:50%;
  overflow:hidden;
  border:3px solid #18d26e;
  box-shadow:
    0 0 0 5px #0d2216,
    0 0 30px #18d26e35;
  animation:logoGlow 2.8s ease-in-out infinite;
}

@keyframes logoGlow{
  0%,100%{
    box-shadow:
      0 0 0 5px #0d2216,
      0 0 20px #18d26e20;
  }
  50%{
    box-shadow:
      0 0 0 5px #0d2216,
      0 0 35px #18d26e55;
  }
}

.auth-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.auth-title{
  text-align:center;
  margin:0;
  font-size:27px;
}

.auth-subtitle{
  text-align:center;
  color:#91a49a;
  margin:8px 0 25px;
  font-size:14px;
}

.auth-input{
  width:100%;
  padding:15px;
  margin-bottom:11px;
  border-radius:14px;
  border:1px solid #263b30;
  outline:none;
  background:#080a09;
  color:white;
  font-size:15px;
  transition:.25s;
}

.auth-input:focus{
  border-color:#18d26e;
  box-shadow:0 0 0 3px #18d26e12;
}

.login-btn{
  position:relative;
  overflow:hidden;
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#18d26e;
  color:#061109;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
}

.login-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px #18d26e25;
}

.login-btn:active{
  transform:scale(.98);
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:20px 0;
  color:#68766e;
  font-size:12px;
}

.divider:before,
.divider:after{
  content:"";
  flex:1;
  height:1px;
  background:#263b30;
}

/* ================= SOCIAL BUTTONS ================= */

.social-btn{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:14px;
  border:1px solid #263b30;
  background:#121a16;
  color:#fff;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease,
    background .25s ease;
}

.social-btn:before{
  content:"";
  position:absolute;
  top:0;
  left:-130%;
  width:80%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    #ffffff18,
    transparent
  );
  transform:skewX(-20deg);
  transition:left .7s ease;
}

.social-btn:hover:before{
  left:150%;
}

.social-btn:hover{
  transform:translateY(-2px);
  border-color:#18d26e;
  box-shadow:0 8px 25px #0008;
}

.social-btn:active{
  transform:scale(.97);
}

.social-icon{
  width:31px;
  height:31px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  flex-shrink:0;
  transition:.35s;
}

.social-btn:hover .social-icon{
  transform:scale(1.13) rotate(7deg);
}

.google-icon{
  background:#fff;
}

.facebook-icon{
  background:#1877f2;
}

.social-icon svg{
  width:19px;
  height:19px;
}

.google-icon svg{
  animation:floatIcon 2.8s ease-in-out infinite;
}

.facebook-icon svg{
  animation:floatIcon 2.8s ease-in-out infinite .3s;
}

@keyframes floatIcon{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-2px);
  }
}

.switch-btn{
  width:100%;
  margin-top:13px;
  padding:10px;
  border:0;
  background:transparent;
  color:#18d26e;
  cursor:pointer;
  font-size:13px;
}

.auth-message{
  min-height:20px;
  margin-top:10px;
  text-align:center;
  color:#91a49a;
  font-size:13px;
  line-height:1.5;
}

.hidden{
  display:none!important;
}

/* ================= DIGITAL CARD ================= */

.wrap{
  max-width:520px;
  margin:auto;
  padding:28px 18px 36px;
  animation:siteAppear .6s ease;

@keyframes siteAppear{

  border-radius:28px;

.avatar{

  height:112px;

  border-radius:50%;
  background:#18d26e;

.avatar img{

h1{

  text-align:center;

.sub{

  color:#91a49a;

.grid{

}

a{

.btn{

.btn:hover{

.ico{

.wide{

.section{

  font-size:12px;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;

.user-box{

  background:#0d2216;
  text-align:center;

.user-email{

.logout-btn{

  border-radius:10px;

  color:white;
  cursor:pointer;
}

.footer{
  margin-top:22px;
  color:#68766e;
  font-size:12px;
  text-align:center;
}
</style>

<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://mmedeahojjxladtmdplc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_h3_fleADmTTN5MrEzvIgjA_o5dJ4_Y7";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* Elements */

const authScreen =
document.getElementById("authScreen");

const site =
document.getElementById("site");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const mainAuthBtn =
document.getElementById("mainAuthBtn");

const googleBtn =
document.getElementById("googleBtn");

const facebookBtn =
document.getElementById("facebookBtn");

const switchAuthBtn =
document.getElementById("switchAuthBtn");

const authTitle =
document.getElementById("authTitle");

const authMessage =
document.getElementById("authMessage");

const userBox =
document.getElementById("userBox");

const userEmail =
document.getElementById("userEmail");

const logoutBtn =
document.getElementById("logoutBtn");


let loginMode = true;


/* Message */

function showMessage(message){

  authMessage.textContent =
    message;

}


/* Show Site */

function showSite(user){

  if(user){

    authScreen.classList.add("hidden");

    site.classList.remove("hidden");

    userBox.style.display =
      "block";

    userEmail.textContent =
      user.email || "";

  }else{

    site.classList.add("hidden");

    authScreen.classList.remove("hidden");

    userBox.style.display =
      "none";

  }

}


/* Login / Signup Switch */

switchAuthBtn.addEventListener(
  "click",
  function(){

    loginMode =
      !loginMode;

    showMessage("");

    if(loginMode){

      authTitle.textContent =
        "Welcome Back";

      mainAuthBtn.textContent =
        "Login";

      switchAuthBtn.textContent =
        "Don't have an account? Create one";

      passwordInput.autocomplete =
        "current-password";

    }else{

      authTitle.textContent =
        "Create Account";

      mainAuthBtn.textContent =
        "Create Account";

      switchAuthBtn.textContent =
        "Already have an account? Login";

      passwordInput.autocomplete =
        "new-password";

    }

  }
);


/* Email Authentication */

mainAuthBtn.addEventListener(
  "click",
  async function(){

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if(!email || !password){

      showMessage(
        "Please enter your email and password."
      );

      return;

    }


    if(password.length < 6){

      showMessage(
        "Password must be at least 6 characters."
      );

      return;

    }


    mainAuthBtn.disabled =
      true;

    mainAuthBtn.textContent =
      "Please wait...";

    showMessage("");


    try{

      if(loginMode){

        const {data,error} =
          await supabaseClient.auth
            .signInWithPassword({

              email:email,
              password:password

            });


        if(error){

          showMessage(
            error.message
          );

        }else{

          showSite(data.user);

        }

      }else{

        const {data,error} =
          await supabaseClient.auth
            .signUp({

              email:email,
              password:password,

              options:{
                emailRedirectTo:
                  window.location.origin +
                  window.location.pathname
              }

            });


        if(error){

          showMessage(
            error.message
          );

        }else if(data.session){

          showSite(data.user);

        }else{

          showMessage(
            "Account created! Check your email and verify your account."
          );

          emailInput.value="";
          passwordInput.value="";

        }

      }

    }catch(error){

      showMessage(
        "Something went wrong. Please try again."
      );

    }


    mainAuthBtn.disabled =
      false;

    mainAuthBtn.textContent =
      loginMode
      ? "Login"
      : "Create Account";

  }
);


/* OAuth */

async function oauthLogin(provider){

  showMessage("");

  googleBtn.disabled =
    true;

  facebookBtn.disabled =
    true;


  try{

    const {error} =
      await supabaseClient.auth
        .signInWithOAuth({

          provider:provider,

          options:{
            redirectTo:
              window.location.origin +
              window.location.pathname
          }

        });


    if(error){

      showMessage(
        error.message
      );

    }

  }catch(error){

    showMessage(
      "Could not start login. Please try again."
    );

  }


  googleBtn.disabled =
    false;

  facebookBtn.disabled =
    false;

}


googleBtn.addEventListener(
  "click",
  function(){
    oauthLogin("google");
  }
);


facebookBtn.addEventListener(
  "click",
  function(){
    oauthLogin("facebook");
  }
);


/* Logout */

logoutBtn.addEventListener(
  "click",
  async function(){

    await supabaseClient.auth.signOut();

    emailInput.value="";
    passwordInput.value="";

    showMessage("");

    showSite(null);

  }
);


/* Auth State */

supabaseClient.auth.onAuthStateChange(
  function(event,session){

    showSite(
      session?.user || null
    );

  }
);


/* Existing Session */

async function checkSession(){

  const {data} =
    await supabaseClient.auth
      .getSession();

  showSite(
    data.session?.user || null
  );

}

checkSession();

</script>
