<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://mmedeahojjxladtmdplc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_h3_fleADmTTN5MrEzvIgjA_o5dJ4_Y7";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* Elements */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const mainAuthBtn =
document.getElementById("mainAuthBtn");

const switchAuthBtn =
document.getElementById("switchAuthBtn");

const authTitle =
document.getElementById("authTitle");

const authMessage =
document.getElementById("authMessage");

const authForms =
document.getElementById("authForms");

const userBox =
document.getElementById("userBox");

const userEmail =
document.getElementById("userEmail");

const logoutBtn =
document.getElementById("logoutBtn");


let loginMode = false;


/* Message */

function showMessage(message){
  authMessage.textContent = message;
}


/* Switch Login / Signup */

switchAuthBtn.addEventListener("click", function(){

  loginMode = !loginMode;

  showMessage("");

  if(loginMode){

    authTitle.textContent = "Login";

    mainAuthBtn.textContent = "Login";

    switchAuthBtn.textContent =
      "Don't have an account? Create one";

    passwordInput.autocomplete = "current-password";

  }else{

    authTitle.textContent = "Create Account";

    mainAuthBtn.textContent = "Create Account";

    switchAuthBtn.textContent =
      "Already have an account? Login";

    passwordInput.autocomplete = "new-password";
  }

});


/* Sign Up / Login */

mainAuthBtn.addEventListener("click", async function(){

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  if(!email || !password){

    showMessage(
      "Please enter your email and password."
    );

    return;
  }

  if(password.length < 6){

    showMessage(
      "Password must be at least 6 characters."
    );

    return;
  }


  mainAuthBtn.disabled = true;

  mainAuthBtn.textContent = "Please wait...";


  try{

    if(!loginMode){

      /* SIGN UP */

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            emailRedirectTo:
              "https://turbon-zzozz.github.io/Ziad-Emad/"
          }

        });


      if(error){

        showMessage(error.message);

      }else{

        showMessage(
          "Account created! Check your email and click the verification link."
        );

        emailInput.value = "";
        passwordInput.value = "";
      }


    }else{

      /* LOGIN */

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if(error){

        showMessage(error.message);

      }else{

        showMessage("Login successful!");

        updateUser(data.user);
      }

    }

  }catch(error){

    showMessage(
      "Something went wrong. Please try again."
    );

  }


  mainAuthBtn.disabled = false;

  mainAuthBtn.textContent =
    loginMode ? "Login" : "Create Account";

});


/* Show logged user */

function updateUser(user){

  if(!user){

    authForms.style.display = "block";

    userBox.style.display = "none";

    return;
  }

  authForms.style.display = "none";

  userBox.style.display = "block";

  userEmail.textContent =
    user.email || "";
}


/* Logout */

logoutBtn.addEventListener("click", async function(){

  await supabaseClient.auth.signOut();

  updateUser(null);

  emailInput.value = "";
  passwordInput.value = "";

  showMessage("");

});


/* Check current session */

async function checkSession(){

  const {
    data
  } = await supabaseClient.auth.getSession();

  updateUser(data.session?.user || null);

}


/* Listen for auth changes */

supabaseClient.auth.onAuthStateChange(
  function(event, session){

    updateUser(
      session?.user || null
    );

  }
);


checkSession();

</script>
